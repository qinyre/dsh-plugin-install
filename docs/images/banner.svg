<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="dsh-plugin-install：让每个 dsh 插件在原地看见自己的更新" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1322"/>
      <stop offset="1" stop-color="#152a4d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4dabf7"/>
      <stop offset="1" stop-color="#2ee6d6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.92" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.02" cy="0.98" r="0.7">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#3b5f8f"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="300" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="300" fill="url(#bg)"/>
    <rect width="1280" height="300" fill="url(#glowA)"/>
    <rect width="1280" height="300" fill="url(#glowB)"/>
    <rect x="760" width="520" height="300" fill="url(#dots)" opacity="0.16"/>
  </g>

  <g transform="translate(150,150)">
    <path d="M 95 0 A 95 95 0 1 0 22 -92.4" fill="none" stroke="url(#accent)" stroke-width="11" stroke-linecap="round"/>
    <path d="M -14 -95 L 22 -110 L 22 -80 Z" fill="#2ee6d6"/>
    <circle cx="95" cy="0" r="14" fill="#22c55e" stroke="#0b1322" stroke-width="5"/>
    <rect x="-56" y="-56" width="112" height="112" rx="18" fill="#0d1e35" stroke="url(#accent)" stroke-width="3.5"/>
    <line x1="-50" y1="-22" x2="50" y2="-22" stroke="#2c4a78" stroke-width="3"/>
    <rect x="-16" y="8" width="60" height="12" rx="6" fill="#54749e"/>
    <rect x="-34" y="34" width="40" height="8" rx="4" fill="#3d5d8a"/>
  </g>

  <text x="300" y="122" font-size="48" font-weight="700" letter-spacing="0.5" fill="#ecf4ff">dsh-plugin-install</text>
  <text x="303" y="168" font-size="24" fill="#9db8d9">让每个 dsh 插件在原地看见自己的更新</text>

  <g font-size="16" fill="#9fc3e8" text-anchor="middle">
    <rect x="303" y="202" width="100" height="32" rx="16" fill="#12233f" stroke="#2c4a78" stroke-width="1.5"/>
    <text x="353" y="223">更新绿点</text>
    <rect x="415" y="202" width="100" height="32" rx="16" fill="#12233f" stroke="#2c4a78" stroke-width="1.5"/>
    <text x="465" y="223">一键更新</text>
    <rect x="527" y="202" width="100" height="32" rx="16" fill="#12233f" stroke="#2c4a78" stroke-width="1.5"/>
    <text x="577" y="223">热替换</text>
    <rect x="639" y="202" width="100" height="32" rx="16" fill="#12233f" stroke="#2c4a78" stroke-width="1.5"/>
    <text x="689" y="223">兜底重启</text>
    <rect x="751" y="202" width="100" height="32" rx="16" fill="#12233f" stroke="#2c4a78" stroke-width="1.5"/>
    <text x="801" y="223">强制卸载</text>
    <rect x="863" y="202" width="100" height="32" rx="16" fill="#12233f" stroke="#2c4a78" stroke-width="1.5"/>
    <text x="913" y="223">降级防护</text>
  </g>
</svg>
