<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">DSH Install — Plugin updates. Right here.</title>
  <desc id="desc">dsh 插件更新工具。米白色横幅右侧展示插件列表示意：更新提示、更新按钮和已是最新状态。</desc>
  <rect x="1" y="1" width="1278" height="398" rx="16" fill="#f5f3ed" stroke="#deded5"/>
  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2" fill="#67726a">
    <text x="56" y="49">DSH / COMMUNITY PLUGINS</text>
    <text x="1224" y="49" text-anchor="end" fill="#25745b">01 — INSTALL</text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="72" letter-spacing="-2">
    <text x="52" y="145" fill="#242e28">Plugin updates.</text>
    <text x="52" y="222" fill="#25745b">Right here.</text>
  </g>
  <text x="56" y="272" fill="#5e6961" font-size="20" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">检查、更新，留在熟悉的插件页。</text>

  <rect x="738" y="79" width="488" height="233" rx="12" fill="#e6e9e0"/>
  <rect x="726" y="67" width="488" height="233" rx="12" fill="#fffefa" stroke="#d8ddd2"/>
  <g font-family="'Segoe UI', sans-serif">
