    <path d="M726 116H1214M750 210H1190" stroke="#e8eae2"/>
    <rect x="750" y="139" width="44" height="44" rx="10" fill="#e9f2e8"/>
    <g fill="none" stroke="#25745b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M764 157h16v15h-16zM769 157v-5h6v5M769 162h6"/>
    </g>
    <circle cx="792" cy="141" r="5" fill="#43a577" stroke="#fffefa" stroke-width="3"/>
    <text x="808" y="158" font-size="15" font-weight="600" fill="#27342c">dsh-plugin-capabilities</text>
    <text x="808" y="179" font-size="12" fill="#768075">New version available</text>
