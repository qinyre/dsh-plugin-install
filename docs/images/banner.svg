    <text x="808" y="249" font-size="15" font-weight="600" fill="#27342c">dshmarket</text>
    <text x="808" y="270" font-size="12" fill="#768075">Up to date</text>
    <path d="m1163 252 5 5 9-10" fill="none" stroke="#8a9687" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M56 336H1224" stroke="#d8ddd2"/>
  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="13">
